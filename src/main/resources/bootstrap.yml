# Application specific configurations
log:
  debug: ${LOGGING_TRACE_ENABLED}

umdc:
  management:
    clientRoles: ${AUTH_ROLE_ID}  # Client roles for management
  api:
    excludes: none
    exclude:
      methods: accessToken,generateTokenSession
    endpoint: /api/v1  # API endpoint for the application
  consumer:
    group-id: ${PRX_CONSUMER_GROUP_ID:mercury-multi-channel}
    topics:
      telegram: mercury-telegram-messages
      sms: mercury-sms-messages
      email: mercury-email-messages
      whatsapp: mercury-whatsapp-messages
      push: mercury-push-messages
      notification: ${UMDC_NOTIFICATION_TOPIC:unified-message-notification}
    mercury:
      topic: ${MERCURY_EMAIL_TOPIC}
  # Kafka related toggles (allow disabling consumers or preventing auto-start)
  kafka:
    # Set to false to disable creating Kafka consumer beans entirely
    enabled: ${UMDC_KAFKA_ENABLED:true}
    # Controls whether listener containers auto-start on context refresh. Set to false for local dev when Kafka is unavailable
    auto-startup: ${UMDC_KAFKA_AUTO_STARTUP:false}
    client-id: ${KAFKA_CLIENT_ID:u5c06022c8c6@application-user.avns.net}
    # Aiven Kafka with SASL_SSL: set KAFKA_SECURITY_PROTOCOL=SASL_SSL, KAFKA_SASL_MECHANISM=SCRAM-SHA-256,
    # and KAFKA_SASL_JAAS_CONFIG via Vault. Leave PLAINTEXT for local dev without a broker.
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    sasl:
      mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      jaas:
        config: ${KAFKA_SASL_JAAS_CONFIG:}
    ssl:
      endpoint:
        identification:
          algorithm: ${KAFKA_SSL_ENDPOINT_ID_ALGO:https}
      keystore:
        # Non-PEM fallback (PKCS12/JKS)
        location: ${KAFKA_SSL_KEYSTORE_LOCATION:classpath:aiven-kafka.p12}
        password: ${KAFKA_SSL_KEYSTORE_PASSWORD:${SSL_KEYSTORE_PASSWORD:changeit}}
        type: ${KAFKA_SSL_KEYSTORE_TYPE:PEM}
        # PEM: separate cert and key files (Aiven standard)
        certificate:
          location: ${KAFKA_SSL_KEYSTORE_CERT_LOCATION:classpath:aiven-kafka-7e59598.cert}
        key:
          location: ${KAFKA_SSL_KEYSTORE_KEY_LOCATION:classpath:aiven-kafka-7e59598.key}
      truststore:
        location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:classpath:aiven-kafka-7e59598.pem}
        password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:${SSL_TRUSTSTORE_PASSWORD:changeit}}
        type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PEM}
  # Default consumer group id used by listeners that reference ${prx.consumer.group-id}
  logging:
    trace:
      enabled: ${LOGGING_TRACE_ENABLED}
  auth:
    converter:
      resource-id: ${AUTH_CLIENT_ID}  # Resource ID for the authentication client
      principal-claim-name: ${AUTH_RESOURCE_PRINCIPAL}  # Principal claim name for the resourceauth:
    clients:
      - id: backbone
        authorization-grant-type: ${BACKBONE_GRANT_TYPE}
        scope: ${BACKBONE_SCOPE}
        client-secret: ${BACKBONE_CLIENT_SECRET}
        client-id: ${BACKBONE_CLIENT_ID}
        redirect-uri: ${AUTH_URI}${AUTH_TOKEN_URI}
        username: ${BACKBONE_USERNAME}
        password: ${BACKBONE_PASSWORD}
      - id: mercury
        authorization-grant-type: ${MERCURY_GRANT_TYPE}
        scope: ${MERCURY_SCOPE}
        client-secret: ${MERCURY_CLIENT_SECRET}
        client-id: ${MERCURY_CLIENT_ID}
        redirect-uri: ${AUTH_URI}${AUTH_TOKEN_URI}
        username: ${MERCURY_USERNAME}
        password: ${MERCURY_PASSWORD}
  verification:
    code:
      template:
        id: ${PRX_VERIFICATION_CODE_TEMPLATE_ID}  # Verification code template ID
  scheduler:
    send-email:
      fixed-rate: ${PRX_SCHEDULER_SEND_EMAIL_RATE:60000}        # Rate for triggering email sends (ms); default 60 s
    save-message-processed:
      fixed-rate: ${PRX_SCHEDULER_SAVE_MESSAGE_RATE:300000}     # Rate for persisting sent messages (ms); default 5 min
  bootstrap:
    server:
      url: ${BOOTSTRAP_SERVER_URI} # URL for the bootstrap server
      port: ${BOOTSTRAP_SERVER_PORT} # Port for the bootstrap server
  security:
    jwt:
      secret: ${APP_TOKEN_SECRET:bG9jYWxEZXZTZWNyZXRLZXlGb3JNZXJjdXJ5Tm90Rm9yUHJvZHVjdGlvblVzZTEyMzQ1Ng==}
      expirationMs: ${APP_TOKEN_EXPIRATION:3600000}
    keystore:
      location: ${SSL_KEYSTORE_LOCATION}  # Location of the keystore
      type: ${SSL_KEYSTORE_TYPE}  # Type of the keystore
      password: ${SSL_KEYSTORE_PASSWORD}  # Password for the keystore
    truststore:
      location: ${SSL_TRUSTSTORE_LOCATION}  # Location of the truststore
      type: ${SSL_TRUSTSTORE_TYPE}  # Type of the truststore
      password: ${SSL_TRUSTSTORE_PASSWORD}  # Password for the truststore
    management-authenticator:
      enabled: true  # Enable management authenticator
      keystore:
        location: ${SSL_KEYSTORE_LOCATION}  # Location of the keystore for management
        type: ${SSL_KEYSTORE_TYPE}  # Type of the keystore for management
        password: ${SSL_KEYSTORE_PASSWORD}  # Password for the keystore for management
      truststore:
        location: ${SSL_TRUSTSTORE_LOCATION}  # Location of the truststore for management
        type: ${SSL_TRUSTSTORE_TYPE}  # Type of the truststore for management
        password: ${SSL_TRUSTSTORE_PASSWORD}  # Password for the truststore for management
app:
  clientRoles: ${AUTH_ROLE_ID}
  # The environments for the application
  api:
    excludes: none
    exclude:
      methods: accessToken,generateTokenSession
    endpoint: /api/v1  # API endpoint for the application
  # The name of the application
  name: mercury
  # The version of the application
  version: 0.0.1
# Spring Boot specific configurations
# Server specific configurations
server:
  port: ${APP_PORT}
  ssl:
    # Enables SSL for the server; defaults to false for local dev, set SSL_ENABLED=true in deployed environments
    enabled: ${SSL_ENABLED:false}
    # The SSL bundle for the server
    bundle: mercury-security
    enabled-protocols: TLSv1.3
    compression:
      enabled: true
      mime-types: text/html,text/xml,text/plain,text/css,application/json
      min-response-size: 1024
spring:
  kafka:
    # Bootstrap server drawn from the same env-vars used by ConsumerConfig
    bootstrap-servers: ${BOOTSTRAP_SERVER_URI:localhost}:${BOOTSTRAP_SERVER_PORT:9092}
    consumer:
      group-id: ${PRX_CONSUMER_GROUP_ID:mercury-multi-channel}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: true
        spring.json.trusted.packages: '*'
    listener:
      # Mirror prx.kafka.auto-startup so the Spring-Boot-autoconfigured factory
      # also does NOT auto-start when Kafka is unavailable locally
      auto-startup: ${UMDC_KAFKA_AUTO_STARTUP:false}
  freemarker:
    template-loader-path: ${TEMPLATE_PATH}
    suffix: ${TEMPLATE_SUFFIX}
    check-template-location: false

  mail:
    smtp:
      ssl:
        trust: ${MAIL_HOST}  # Trust the mail server
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}  # Port for the mail server
    username: ${MAIL_USERNAME}  # Username for the mail server
    password: ${MAIL_PASSWORD}  # Password for the mail server
    protocol: ${MAIL_PROTOCOL}  # Protocol for the mail server
    properties:
      mail.smtp.auth: ${MAIL_PROPERTIES_SMTP_AUTH:true}  # Enable SMTP authentication
      mail.smtp.starttls.enable: ${MAIL_PROPERTIES_STARTTLS_ENABLED:true}  # Enable STARTTLS
#      mail.smtp.ssl.trust: ${MAIL_HOST}  # Trust the mail host
      mail.smtp.connectiontimeout: 5000  # Connection timeout in milliseconds
      mail.smtp.timeout: 5000  # Timeout in milliseconds
      mail.smtp.writetimeout: 5000  # Write timeout in milliseconds
  datasource:
    username: ${MERCURY_DB_USERNAME}  # Username for the database
    password: ${MERCURY_DB_PASSWORD}  # Password for the database
    url: jdbc:postgresql://${MERCURY_DB_URI}:${MERCURY_DB_PORT}/${MERCURY_DB_NAME}?prepareThreshold=0  # JDBC URL for the database
    driver-class-name: org.postgresql.Driver  # Driver class name for PostgresSQL
  # JPA (Java Persistence API) settings
  jpa:
    hibernate.ddl-auto: none  # Hibernate DDL auto setting
    show-sql: false  # Show SQL statements
    database: POSTGRESQL  # Database type
    database-platform: org.hibernate.dialect.PostgreSQLDialect  # Hibernate dialect for PostgresSQL
    properties:
      jdbc:
        lob.non_contextual_creation: true  # Non-contextual LOB creation
      hibernate:
        boot:
                  allow_jdbc_metadata_access: true
    log-level: error
    defer-datasource-initialization: true
  ssl:
    bundle:
      jks:
        mercury-security:
          keystore:
            location: classpath:${SSL_KEYSTORE_LOCATION}
            password: ${SSL_KEYSTORE_PASSWORD}
            type: ${SSL_KEYSTORE_TYPE}
          truststore:
            location: classpath:${SSL_TRUSTSTORE_LOCATION}
            password: ${SSL_TRUSTSTORE_PASSWORD}
            type: ${SSL_TRUSTSTORE_TYPE}
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration
  mustache:
    check-template-location: false
  test:
    context:
      failure:
        threshold: 10000000
  main:
    # Allows overriding of bean definitions
    allow-bean-definition-overriding: true
  profiles:
    active: ${SPRING_BOOT_PROFILE_ACTIVE}
  application:
    # The name of the Spring Boot application, taken from the app.name property
    name: ${app.name}
  security:
    # Disables the security for the Spring Boot application
    oauth2:
      clientRegistrationId: mercury-backend-client
      client:
        registration:
          external:
            provider: external
            client-id: ${AUTH_CLIENT_ID}
            client-secret: ${AUTH_CLIENT_SECRET}
            scope: profile mercury-backend-app-scope openid
            authorization-grant-type: password
        provider:
          external:
            issuer-uri: ${AUTH_URI}
            jwk-set-uri: ${spring.security.oauth2.client.provider.external.issuer-uri}/protocol/openid-connect/certs
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_URI}
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}${AUTH_CERT_URI}
  cloud:
    # The Spring Cloud Config specific configurations
    #<><><><><><><><><><><><><><> VAULT <><><><><><><><><><><><><><>
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_URI:https://vault.umdc-qa.tst}
      authentication: TOKEN
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: ${VAULT_KV_BACKEND:secret}
        default-context: ${spring.application.name}
        profile-separator: /
      # No spring.cloud.vault.ssl block here on purpose. VaultConfiguration#createSslConfiguration
      # only skips building a custom SslConfiguration when ssl.trust-store binds to null — and a
      # YAML placeholder ALWAYS resolves to a non-null Resource once it has any default (even a
      # sentinel), so "classpath:${SSL_TRUSTSTORE_LOCATION:some-default}" is fatal whenever the env
      # var is unset: Spring resolves the sentinel path, KeyStoreConfiguration asserts it exists,
      # and bean creation fails ("class path resource [...] does not exist"). Baking a real
      # truststore file into the classpath to give it a valid default is exactly the anti-pattern
      # removed from this repo after the keystore.jks incident. Instead, the container's own JVM
      # trust store (see docker-entrypoint.sh / Dockerfile -Djavax.net.ssl.trustStore) already
      # supplies whatever trust anchors Vault's HTTP client needs, since Vault falls back to the
      # JVM default SSLContext when no vault-specific ssl config is present.
    bootstrap:
      # Enables the Spring Cloud Bootstrap application context
      enabled: ${SPRING_BOOT_CLOUD_BOOTSTRAP_ENABLED}
    # The active profile for the Spring Boot application
    profile: ${SPRING_BOOT_PROFILE_ACTIVE}
    config:
      # The active profile for the Spring Cloud Config
      profile: ${SPRING_BOOT_PROFILE_ACTIVE}
      # The label for the Spring Cloud Config
      label: ${SPRING_CLOUD_CONFIG_LABEL}
      # The URI for the Spring Cloud Config server — must be a full URL (scheme+host+port),
      # e.g. https://config-server:8082. ConfigClientProperties has no "port" field (only
      # "uri", a String[]), so a separate spring.cloud.config.port key binds to nothing —
      # CNFS_PORT is real, but only as config-server's OWN server.port, not this client's.
      uri: ${CNFS_URI}
      # Enables sending of state for the Spring Cloud Config
      send-state: true
      tls:
        enabled: true
        trust-store: classpath:${SSL_TRUSTSTORE_LOCATION}
        trust-store-password: ${SSL_TRUSTSTORE_PASSWORD}
        trust-store-type: ${SSL_TRUSTSTORE_TYPE}
  mongodb:
    representation:
      uuid: STANDARD
    port: ${MONGO_PORT}
    database: ${MONGO_DATABASE}
    username: ${MONGO_USERNAME}
    host: ${MONGO_HOST}
    password: ${MONGO_PASSWORD}
    uri: mongodb+srv://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}/${MONGO_DATABASE}?retryWrites=true&w=majority
logging:
  level:
    org.springframework.cloud.configuration.SSLContextFactory: ERROR

swagger:
  base-package: 'com.umdc.mercury.api.v1.controller'
  api-info:
    title: ${app.name}
    version: ${app.version}
    description: ${app.description}
    contact:
      name: 'Luis Antonio Mata'
      url: 'www.prx.test'
      email: 'luis.antonio.mata@gmail.com'
    cache:
      disabled: true
