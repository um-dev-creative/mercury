# docker-compose.yml — Entorno de desarrollo local únicamente.
# Para despliegue en Kubernetes (cert-manager, Ingress, etc.), ver k8s/
#
# Config split in two, by sensitivity:
#   - config/local.env  (versioned) — bootstrap identity: which environment, and
#     how to reach Vault/Config Server. No credentials.
#   - secrets/local.env (gitignored, copy secrets/local.env.example) — the one
#     bootstrap secret Vault can't hand us: VAULT_TOKEN. Everything else (DB,
#     Mongo, mail, OAuth, Kafka SASL, etc.) is resolved from Vault's own KV store
#     at runtime and never belongs in either file, nor in a Helm values file.
#
# config/local.env is ALSO this file's source for ${...} substitution below (e.g.
# MERCURY_TEMPLATES_HOST_PATH) — Compose does not read env_file: entries for its own
# variable substitution (only shell env or an --env-file), so invoke as:
#   docker compose --env-file config/local.env build mercury
#   docker compose --env-file config/local.env up -d mercury
# (plain `docker compose up` falls back to this file's own inline defaults, so it
# still works for a quick local check — it just won't honor config/local.env overrides.)
services:
  mercury:
    build: .
    container_name: mercury
    image: lamata/mercury:0.0.2
    hostname: umdc-qa
    domainname: mercury.umdc-qa.tst
    dns_search:
      - tst
    extra_hosts:
      # These map PRX service FQDNs to pinned IPs on nginx_umdc-net (172.29.0.0/16).
      # config-server and vault must run on nginx_umdc-net with these IPs (see NETWORK_SETUP.md).
      - "config-server.umdc-qa.tst:172.22.0.2"
      - "vault.umdc-qa.tst:172.22.0.2"
      - "monitor.umdc-qa.tst:172.22.0.2"
      - "api.umdc-qa.tst:172.22.0.2"
    networks:
      nginx_umdc-net:
        ipv4_address: 172.22.0.10
    ports:
      - "8118:8118"
    env_file:
      - config/local.env
      - secrets/local.env
    volumes:
      # certs/mercury/ holds private keys, so it is NOT in the image (a pushed image is readable by whoever can pull it): it is mounted
      # read-only at the fixed path application.yml reads (file:certs/mercury/...). create_host_path: false makes a missing folder an
      # error instead of Docker silently creating an empty one. On a Linux host the files must be readable by the image's user (chmod 644).
      - type: bind
        source: ./certs/mercury
        target: /usr/local/runme/certs/mercury
        read_only: true
        bind:
          create_host_path: false
      # No templates are baked into the image or kept in the repo: they live in the storage set by TEMPLATE_STORAGE
      # (s3/r2 = the Cloudflare R2 bucket, no volume needed). Only for TEMPLATE_STORAGE=local, uncomment to mount a WRITABLE
      # host directory (never `:ro`: saving a template from Iris writes there):
      # - ${MERCURY_TEMPLATES_HOST_PATH}:/usr/local/runme/templates

networks:
  nginx_umdc-net:
    external: true
    name: nginx_umdc-net

